[project]
name = "finalproject-kurov-m26-555"
version = "0.1.0"
description = "Console currency wallet application with parsing service"
readme = "README.md"
authors = [
    { name = "Artem Kurov", email = "kurov.artem308@gmail.ru" }
]
requires-python = ">=3.12"
dependencies = []

[project.scripts]
valutatrade = "main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = [
    "valutatrade_hub",
    "main.py"
]

[tool.uv]
package = true
